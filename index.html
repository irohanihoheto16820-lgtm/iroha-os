<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Multi-OS Web Playground (iPadOS / macOS / Windows 11)</title>
<style>
  :root {
    --bg-ipad: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #ff7e5f 100%);
    --bg-mac: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
    --bg-win: linear-gradient(135deg, #001f3f 0%, #0074D9 60%, #7FDBFF 100%);
    --glass: rgba(255, 255, 255, 0.25);
    --border-glass: rgba(255, 255, 255, 0.35);
  }

  * {
    box-sizing: border-box;
    user-select: none;
    -webkit-user-select: none;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }

  body, html {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    transition: background 0.5s ease;
  }

  body.os-ipad { background: var(--bg-ipad); }
  body.os-mac  { background: var(--bg-mac); }
  body.os-win  { background: var(--bg-win); }

  #os-switcher {
    position: fixed;
    top: 36px;
    right: 16px;
    z-index: 9999;
    display: flex;
    gap: 6px;
    background: rgba(0, 0, 0, 0.55);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 6px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.25);
    box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  }

  .os-btn {
    border: none;
    background: transparent;
    color: #ddd;
    padding: 6px 14px;
    border-radius: 14px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }

  .os-btn:hover { background: rgba(255,255,255,0.15); color: #fff; }
  .os-btn.active { background: #fff; color: #111; box-shadow: 0 2px 8px rgba(0,0,0,0.2); }

  #top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 28px;
    padding: 0 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    z-index: 5000;
    transition: all 0.3s;
  }

  body.os-ipad #top-bar { background: transparent; }
  body.os-mac #top-bar  { background: rgba(0, 0, 0, 0.35); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  body.os-win #top-bar  { display: none; }

  #desktop {
    position: relative;
    width: 100%;
    height: 100%;
    padding: 48px 24px 90px;
  }

  #icon-grid {
    display: grid;
    gap: 24px;
    transition: all 0.3s;
  }

  body.os-ipad #icon-grid {
    grid-template-columns: repeat(auto-fill, 84px);
    justify-content: center;
    max-width: 680px;
    margin: 40px auto 0;
  }

  body.os-mac #icon-grid {
    grid-template-columns: 80px;
    justify-content: end;
    margin-top: 10px;
  }

  body.os-win #icon-grid {
    grid-template-columns: 80px;
    justify-content: start;
    margin-top: -20px;
  }

  .app-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    color: #fff;
    text-align: center;
    transition: transform 0.15s;
  }

  .app-icon:active { transform: scale(0.92); }

  .icon-box {
    width: 58px;
    height: 58px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 28px;
    margin-bottom: 6px;
    box-shadow: 0 8px 16px rgba(0,0,0,0.25);
    transition: border-radius 0.3s;
  }

  body.os-ipad .icon-box { border-radius: 15px; }
  body.os-mac .icon-box  { border-radius: 14px; }
  body.os-win .icon-box  { border-radius: 8px; }

  .icon-label {
    font-size: 12px;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    font-weight: 500;
  }

  #dock-container {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    display: flex;
    justify-content: center;
    z-index: 6000;
    transition: all 0.3s;
  }

  body.os-ipad #dock-container { bottom: 16px; }
  body.os-ipad #dock {
    background: var(--glass);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid var(--border-glass);
    border-radius: 26px;
    padding: 10px 16px;
    display: flex;
    gap: 14px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.3);
  }

  body.os-mac #dock-container { bottom: 10px; }
  body.os-mac #dock {
    background: rgba(255, 255, 255, 0.22);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.3);
    border-radius: 18px;
    padding: 8px 12px;
    display: flex;
    gap: 10px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.35);
  }

  body.os-win #dock-container { bottom: 0; }
  body.os-win #dock {
    width: 100%;
    height: 48px;
    background: rgba(20, 28, 45, 0.78);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    border-top: 1px solid rgba(255,255,255,0.15);
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    padding: 0 16px;
  }

  .dock-item {
    width: 48px;
    height: 48px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 24px;
    cursor: pointer;
    transition: transform 0.2s;
  }

  body.os-win .dock-item {
    width: 38px;
    height: 38px;
    font-size: 20px;
    border-radius: 6px;
  }
  body.os-win .dock-item:hover { background: rgba(255,255,255,0.12); }
  body.os-mac .dock-item:hover { transform: scale(1.2) translateY(-6px); }
  body.os-ipad .dock-item:hover { transform: scale(1.1); }

  #win-clock {
    display: none;
    position: absolute;
    right: 16px;
    color: #fff;
    font-size: 12px;
    text-align: right;
    line-height: 1.3;
  }
  body.os-win #win-clock { display: block; }

  .window {
    position: absolute;
    top: 90px;
    left: 60px;
    width: 360px;
    max-width: 90vw;
    min-height: 260px;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(24px);
    -webkit-backdrop-filter: blur(24px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.35);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    z-index: 100;
    animation: popIn 0.2s ease-out;
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.95); }
    to { opacity: 1; transform: scale(1); }
  }

  body.os-ipad .window { border-radius: 22px; border: 1px solid rgba(255,255,255,0.6); }
  body.os-mac .window  { border-radius: 12px; border: 1px solid rgba(255,255,255,0.5); }
  body.os-win .window  { border-radius: 8px; border: 1px solid rgba(0,0,0,0.15); }

  .win-header {
    height: 40px;
    padding: 0 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(240, 240, 245, 0.8);
    border-bottom: 1px solid rgba(0,0,0,0.08);
    cursor: grab;
    touch-action: none;
  }

  .win-header:active { cursor: grabbing; }

  .win-title {
    font-size: 13px;
    font-weight: 600;
    color: #222;
  }

  .win-controls { display: flex; gap: 8px; align-items: center; }

  body.os-mac .win-header { flex-direction: row-reverse; }
  body.os-mac .win-controls { flex-direction: row-reverse; }
  body.os-mac .ctrl-btn { width: 14px; height: 14px; border-radius: 50%; border: none; cursor: pointer; font-size: 0; }
  body.os-mac .btn-close { background: #ff5f56; }
  body.os-mac .btn-min   { background: #ffbd2e; }
  body.os-mac .btn-max   { background: #27c93f; }

  body.os-win .ctrl-btn { width: 28px; height: 24px; border: none; background: transparent; cursor: pointer; font-size: 13px; border-radius: 4px; }
  body.os-win .btn-close:hover { background: #e81123; color: #fff; }
  body.os-win .btn-min:hover, body.os-win .btn-max:hover { background: rgba(0,0,0,0.08); }

  body.os-ipad .ctrl-btn { border: none; background: rgba(0,0,0,0.1); border-radius: 12px; padding: 4px 10px; font-size: 11px; font-weight: 600; cursor: pointer; }
  body.os-ipad .btn-min, body.os-ipad .btn-max { display: none; }

  .win-body {
    flex: 1;
    padding: 16px;
    color: #222;
    font-size: 14px;
    user-select: text;
    -webkit-user-select: text;
    overflow-y: auto;
  }

  textarea.note-area {
    width: 100%; height: 180px; border: none; background: transparent;
    resize: none; outline: none; font-size: 15px; line-height: 1.6;
  }

  .calc-grid {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px;
  }
  .calc-display {
    width: 100%; padding: 10px; font-size: 22px; text-align: right;
    background: #f0f2f5; border-radius: 8px; border: 1px solid #ddd;
  }
  .calc-btn {
    padding: 12px; font-size: 16px; border: none; border-radius: 8px;
    background: #e4e6eb; cursor: pointer; font-weight: 600;
  }
  .calc-btn:active { background: #d0d2d7; }
  .calc-btn.op { background: #ff9500; color: #fff; }

  #launcher {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    z-index: 8000;
    align-items: center;
    justify-content: center;
  }
  #launcher.open { display: flex; }

  .launcher-box {
    background: rgba(255,255,255,0.92);
    padding: 24px;
    border-radius: 20px;
    width: 320px;
    text-align: center;
    box-shadow: 0 20px 50px rgba(0,0,0,0.4);
  }
</style>
</head>
<body class="os-ipad">

<div id="os-switcher">
  <button class="os-btn active" onclick="switchOS('ipad', this)">📱 iPadOS</button>
  <button class="os-btn" onclick="switchOS('mac', this)">💻 macOS</button>
  <button class="os-btn" onclick="switchOS('win', this)">🪟 Windows 11</button>
</div>

<div id="top-bar">
  <div id="top-left">iPad &nbsp;&nbsp; Wi-Fi</div>
  <div id="top-right">Wi-Fi 100% &nbsp; <span id="clock-top">12:00</span></div>
</div>

<div id="desktop">
  <div id="icon-grid">
    <div class="app-icon" onclick="openApp('notes')">
      <div class="icon-box" style="background: linear-gradient(135deg, #ffd60a, #ff9f0a);">📝</div>

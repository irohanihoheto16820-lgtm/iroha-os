<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>iroha-os Multi-OS</title>
<style>
*{box-sizing:border-box;user-select:none;font-family:-apple-system,sans-serif}
body,html{margin:0;width:100%;height:100%;overflow:hidden;transition:background .4s}
body.ipad{background:linear-gradient(135deg,#1e3c72,#2a5298,#ff7e5f)}
body.mac{background:linear-gradient(135deg,#0f2027,#203a43,#2c5364)}
body.win{background:linear-gradient(135deg,#001f3f,#0074D9,#7FDBFF)}
#sw{position:fixed;top:34px;right:12px;z-index:999;display:flex;gap:4px;background:rgba(0,0,0,.6);padding:5px;border-radius:18px}
.sb{border:0;background:0;color:#ddd;padding:6px 12px;border-radius:14px;font-size:12px;font-weight:700}
.sb.on{background:#fff;color:#111}
#bar{position:fixed;top:0;left:0;right:0;height:26px;padding:0 14px;display:flex;justify-content:space-between;align-items:center;color:#fff;font-size:12px;font-weight:600}
body.mac #bar{background:rgba(0,0,0,.35)}
body.win #bar{display:none}
#grid{display:grid;gap:20px;padding:60px 24px}
body.ipad #grid{grid-template-columns:repeat(4,76px);justify-content:center;margin-top:30px}
body.mac #grid{grid-template-columns:76px;justify-content:end}
body.win #grid{grid-template-columns:76px;justify-content:start;padding-top:20px}
.ic{display:flex;flex-direction:column;align-items:center;color:#fff;font-size:12px;text-shadow:0 1px 3px #000}
.ib{width:54px;height:54px;display:flex;align-items:center;justify-content:center;font-size:26px;margin-bottom:5px;box-shadow:0 6px 14px rgba(0,0,0,.3)}
body.ipad .ib{border-radius:15px}body.mac .ib{border-radius:13px}body.win .ib{border-radius:6px}
#dock-wrap{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;z-index:500}
body.ipad #dock-wrap{bottom:14px}
body.ipad #dock{background:rgba(255,255,255,.28);backdrop-filter:blur(16px);border-radius:24px;padding:8px 14px;display:flex;gap:12px}
body.mac #dock-wrap{bottom:8px}
body.mac #dock{background:rgba(255,255,255,.22);backdrop-filter:blur(16px);border-radius:16px;padding:6px 10px;display:flex;gap:10px}
body.win #dock{width:100%;height:46px;background:rgba(18,26,42,.85);display:flex;justify-content:center;align-items:center;gap:10px}
.di{width:44px;height:44px;display:flex;align-items:center;justify-content:center;font-size:22px}
body.win .di{width:36px;height:36px;font-size:19px}
#wclk{display:none;position:absolute;right:14px;color:#fff;font-size:11px;text-align:right}
body.win #wclk{display:block}
.win{position:absolute;top:85px;left:30px;width:320px;max-width:88vw;background:rgba(255,255,255,.94);box-shadow:0 16px 40px rgba(0,0,0,.35);overflow:hidden;z-index:100}
body.ipad .win{border-radius:20px}body.mac .win{border-radius:12px}body.win .win{border-radius:6px}
.wh{height:38px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;background:#eee;font-size:13px;font-weight:700;touch-action:none}
body.mac .wh{flex-direction:row-reverse}
.cb{border:0;padding:4px 10px;border-radius:10px;background:#ddd;font-weight:700}
body.mac .cb{width:14px;height:14px;padding:0;border-radius:50%;background:#ff5f56;font-size:0}
body.win .cb{background:transparent;border-radius:4px}
.wb{padding:14px;font-size:14px}
textarea{width:100%;height:150px;border:0;background:transparent;resize:none;outline:none;font-size:15px}
.cg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.cd{width:100%;padding:8px;font-size:20px;text-align:right;border:1px solid #ccc;border-radius:6px}
.cbtn{padding:10px;border:0;border-radius:6px;background:#e4e6eb;font-size:15px;font-weight:700}
.op{background:#ff9500;color:#fff}
</style>
</head>
<body class="ipad">
<div id="sw">
  <button class="sb on" onclick="setOS('ipad',this)">📱 iPad</button>
  <button class="sb" onclick="setOS('mac',this)">💻 Mac</button>
  <button class="sb" onclick="setOS('win',this)">🪟 Win11</button>
</div>
<div id="bar"><span id="bl">iPad Wi-Fi</span><span id="clk">12:00</span></div>
<div id="grid">
  <div class="ic" onclick="app('note')"><div class="ib" style="background:#ff9f0a">📝</div>メモ</div>
  <div class="ic" onclick="app('calc')"><div class="ib" style="background:#2c2c2e">🧮</div>電卓</div>
  <div class="ic" onclick="app('term')"><div class="ib" style="background:#000">💻</div>端末</div>
</div>
<div id="dock-wrap"><div id="dock">
  <div class="di" onclick="app('note')">📝</div>
  <div class="di" onclick="app('calc')">🧮</div>
  <div class="di" onclick="app('term')">💻</div>
  <div id="wclk">12:00</div>
</div></div>
<script>
let z=100,drag=null,ox=0,oy=0,cs='';
function setOS(o,b){
  document.body.className=o;
  document.querySelectorAll('.sb').forEach(e=>e.classList.remove('on'));
  b.classList.add('on');
  document.getElementById('bl').innerText=o==='mac'?' Finder ファイル 編集 表示':'iPad Wi-Fi';
}
setInterval(()=>{
  const t=new Date().toTimeString().slice(0,5);
  document.getElementById('clk').innerText=t;
  document.getElementById('wclk').innerText=t;
},1000);
function app(t){
  let w=document.getElementById('w-'+t);
  if(w){w.style.zIndex=++z;return}
  w=document.createElement('div');w.className='win';w.id='w-'+t;w.style.zIndex=++z;
  let title='メモ',body='<textarea placeholder="自由に入力できます..."></textarea>';
  if(t==='calc'){
    title='電卓';
    body='<input id="cd" class="cd" value="0" readonly><div class="cg">'+
    ['7','8','9','/','4','5','6','*','1','2','3','-','C','0','=','+'].map(k=>`<button class="cbtn ${'/+-*='.includes(k)?'op':''}" onclick="ck('${k}')">${k}</button>`).join('')+'</div>';
  }else if(t==='term'){
    title='Linux ターミナル';
    body='<div style="background:#111;color:#4af626;font-family:monospace;padding:10px;border-radius:6px;height:150px">user@iroha-os:~$ uname -a<br>WebOS Multi-Arch Ready!<br>user@iroha-os:~$ █</div>';
  }
  w.innerHTML=`<div class="wh" onpointerdown="sd(event,this.parentElement)"><span>${title}</span><button class="cb" onclick="this.closest('.win').remove()">✕</button></div><div class="wb">${body}</div>`;
  w.onpointerdown=()=>w.style.zIndex=++z;
  document.body.appendChild(w);
}
function sd(e,el){if(e.target.tagName!=='BUTTON'){drag=el;ox=e.clientX-el.offsetLeft;oy=e.clientY-el.offsetTop}}
document.onpointermove=e=>{if(drag){drag.style.left=(e.clientX-ox)+'px';drag.style.top=(e.clientY-oy)+'px'}};
document.onpointerup=()=>drag=null;
function ck(k){
  const d=document.getElementById('cd');
  if(k==='C'){cs='';d.value='0'}
  else if(k==='='){try{cs=String(eval(cs));d.value=cs}catch{d.value='Error';cs=''}}
  else{cs+=k;d.value=cs}
}
</script>
</body>
</html>
